name: Boomify checks
on:
  push:
    branches: ['feature/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test de syntaxe et clips
        run: npm test
